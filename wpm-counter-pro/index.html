<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Metadata -->
    <meta charset="UTF-8" />
    <title>Free Typing WPM Test</title>

    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Container -->
    <div class="container">

        <!-- Title -->
        <h1>Free Typing WPM Test</h1>

        <!-- Control Row -->
        <div class="controls">
            <div class="controls-left">
                <!-- Control Buttons -->
                <button id="startBtn">Start Test</button>
                <button id="stopBtn" disabled>Stop</button>
                <button id="resetBtn" disabled>Reset</button>
            </div>

            <!-- Right Controls -->
            <div class="controls-right">
                <!-- Theme Toggle -->
                <label class="theme-toggle">
                    <input type="checkbox" id="themeToggle">
                    Dark mode
                </label>

                <!-- Timer Display -->
                <div class="timer">
                    Time left: <span id="timeLeft">60</span>s
                </div>
            </div>
        </div>

        <!-- Time Configuration -->
        <div class="time-config">
            <span class="time-config-label">Duration:</span>

            <!-- Hours -->
            <div class="time-box">
                <button class="time-btn minus" data-unit="hours">−</button>
                <div class="time-value-wrapper">
                    <span id="hoursValue" class="time-value">0</span>
                    <span class="time-unit">h</span>
                </div>
                <button class="time-btn plus" data-unit="hours">+</button>
            </div>

            <!-- Minutes -->
            <div class="time-box">
                <button class="time-btn minus" data-unit="minutes">−</button>
                <div class="time-value-wrapper">
                    <span id="minutesValue" class="time-value">1</span>
                    <span class="time-unit">m</span>
                </div>
                <button class="time-btn plus" data-unit="minutes">+</button>
            </div>

            <!-- Seconds -->
            <div class="time-box">
                <button class="time-btn minus" data-unit="seconds">−</button>
                <div class="time-value-wrapper">
                    <span id="secondsValue" class="time-value">0</span>
                    <span class="time-unit">s</span>
                </div>
                <button class="time-btn plus" data-unit="seconds">+</button>
            </div>

            <!-- No Timer Option -->
            <label class="no-timer-label">
                <input type="checkbox" id="noTimerCheckbox">
                No timer (manual stop)
            </label>
        </div>

        <!-- Typing Area -->
        <div id="typingArea" class="typing-area disabled" contenteditable="false" spellcheck="false"></div>

        <!-- Instructions -->
        <div class="hint">
            Configure the time, start the test, then type anything you want.
            Misspelled words turn <span style="color:#dc2626;font-weight:600;">red</span>.
            In <strong>No timer</strong> mode, use the Stop button when you're done.
        </div>

        <!-- Stats Display -->
        <div class="stats">
            <div class="stat-pill">WPM: <strong id="wpm">0</strong></div>
            <div class="stat-pill">Correct words: <strong id="correctWords">0</strong></div>
            <div class="stat-pill">Errors: <strong id="errorWords">0</strong></div>
            <div class="stat-pill">Total words: <strong id="totalWords">0</strong></div>
        </div>

    </div>

    <!-- Script -->
    <script src="script.js"></script>
</body>

</html>
