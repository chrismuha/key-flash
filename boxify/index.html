<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boxify Demo</title>
  <link rel="stylesheet" href="boxify.css" />
</head>

<body>
  <h1>Boxify Demo</h1>
  <p>Click a box to increase quantity. Right-click to decrease. Shift+Click resets to 0.</p>

  <div id="inventory">
    <div class="ui-item" data-label="SSD"></div>
    <div class="ui-item" data-label="RAM"></div>
    <div class="ui-item" data-label="GPU"></div>
    <div class="ui-item" data-label="CPU"></div>
  </div>

  <button id="reset-all" type="button" aria-label="Reset all quantities">Reset All</button>

  <script src="boxify.js"></script>
  <script src="init.js"></script>
</body>

</html>
