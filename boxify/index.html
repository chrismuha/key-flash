<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boxify Demo</title>
  <link rel="stylesheet" href="boxify.css" />
</head>

<body>
  <h1>Boxify Demo</h1>
  <p>
  Hold Command/Control to use the whole box.
  <br> Left Click = increase, Right Click = decrease, Shift+Click resets the active box.
  <br> Hold Option/Alt and press R to reset all boxes.
  <br> Hold Option/Alt and using Arrow keys navigates between boxes.
  </p>

  <div id="inventory">
    <div class="ui-item" data-label="SSD"></div>
    <div class="ui-item" data-label="RAM"></div>
    <div class="ui-item" data-label="GPU"></div>
    <div class="ui-item" data-label="CPU"></div>
    <div class="ui-item" data-label="Motherboard"></div>
    <div class="ui-item" data-label="Power Supply"></div>
    <div class="ui-item" data-label="Cooling"></div>
    <div class="ui-item" data-label="Case"></div>
    <div class="ui-item" data-label="Monitor"></div>
    <div class="ui-item" data-label="Accessory"></div>

    <!-- Reset button as part of the grid -->
    <button id="reset-all" type="button" aria-label="Reset all quantities">
      Reset All
    </button>
  </div>

  <!-- Scripts -->
  <script src="boxify.js"></script>
  <script src="init.js"></script>
</body>

</html>
