<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Accessible Ticked Slider</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <!-- Settings: Snap behavior -->
  <div class="wrap" id="settings-wrap" aria-label="Slider settings">
    <div class="header">
      <div class="title">Settings</div>
    </div>
    <label for="snap-mode" class="sr-only">Snap behavior</label>
    <select id="snap-mode" aria-label="Snap behavior">
      <option value="nearest" selected>Round to nearest (%)</option>
      <option value="next">Snap to next tick</option>
    </select>
    <div class="hint"><br>Choose how values snap on release. <br>Values always snap to next tick with the keyboard.
    </div>
  </div>

  <!-- Volume slider -->
  <div class="wrap" id="volume-wrap">
    <div class="header">
      <div class="title">Volume</div>
      <div class="value" id="volume-value" aria-live="polite">50%</div>
    </div>
    <div class="ticks top" aria-hidden="true"></div>
    <label for="volume" class="sr-only">Volume</label>
    <input id="volume" class="slider progress" type="range" min="0" max="100" step="10" value="50" />
    <div class="ticks bottom" aria-hidden="true"></div>
    <div class="hint"><br>Labels at every 4px. Try the keyboard to snap exactly.</div>
  </div>

  <!-- Font Size slider -->
  <div class="wrap" id="font-wrap">
    <div class="header">
      <div class="title">Font Size</div>
      <div class="value" id="font-value" aria-live="polite">16px</div>
    </div>
    <div class="ticks top" aria-hidden="true"></div>
    <label for="fontsize" class="sr-only">Font size</label>
    <input id="fontsize" class="slider progress" type="range" min="10" max="30" step="2" value="16" />
    <div class="ticks bottom" aria-hidden="true"></div>
    <div class="hint"><br>Labels at every 4px. Try the keyboard to snap exactly.</div>
  </div>

  <script src="main.js"></script>
</body>

</html>
