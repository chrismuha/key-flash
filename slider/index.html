<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Accessible Ticked Slider</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="wrap" id="volume-wrap">
    <div class="header">
      <div class="title">Volume</div>
      <div class="value" id="volume-value" aria-live="polite">50%</div>
    </div>
    <label for="volume" class="sr-only">Volume</label>
    <input id="volume" class="slider progress" type="range" min="0" max="100" step="10" value="50" role="slider"
      aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" aria-valuetext="50 percent" />
    <div class="ticks" aria-hidden="true"></div>
    <div class="hint">Tip: use ← / → to adjust in steps, Home/End for min/max, Page Up/Down for larger jumps.</div>
  </div>

  <div class="wrap" id="font-wrap">
    <div class="header">
      <div class="title">Font Size</div>
      <div class="value" id="font-value" aria-live="polite">16px</div>
    </div>
    <label for="fontsize" class="sr-only">Font size</label>
    <input id="fontsize" class="slider progress" type="range" min="10" max="30" step="2" value="16" role="slider"
      aria-valuemin="10" aria-valuemax="30" aria-valuenow="16" aria-valuetext="16 pixels" />
    <div class="ticks" aria-hidden="true"></div>
    <div class="hint">Labels at every 4px. Try the keyboard to snap exactly.</div>
  </div>

  <script src="script.js"></script>
</body>

</html>
