<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Export PDF Example</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/
jspdf.umd.min.js"></script>
</head>

<body>
    <h1>Export PDF Example</h1>
    <button id="exportButton">Export PDF</button>
    <script>
        document.getElementById('exportButton').addEventListener('click', () => {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            // Add content to the PDF
            doc.text("Hello, this is a sample PDF!", 10, 10);
            // Save the PDF
            doc.save("sample.pdf");
        });
    </script>
</body>

</html>
