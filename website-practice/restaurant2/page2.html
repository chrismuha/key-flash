<!-- Section: Document Type -->
<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Section: Head Meta -->
    <meta charset="UTF-8">
    <title>Restaurant Menu</title>
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
    <!-- Section: Stylesheets -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="page2">
    <!-- Section: Body Content -->

    <!-- Left rail -->
    <nav class="left-rail">
        <img src="logo.webp" alt="" class="nav-logo" aria-hidden="true">
        <a class="box" href="index.html">Pickup or Delivery</a>
        <a class="box active" href="page2.html" aria-current="page">Menu</a>
        <a class="box nav-cart" href="page3.html" aria-label="Cart" title="Cart"><i class="bi bi-cart3" aria-hidden="true"></i><span class="nav-cart-count" aria-hidden="true" hidden>0</span></a>
        <div class="order-type-chip" aria-live="polite" data-empty="true">
            <span class="order-type-chip__label">Pickup or Delivery</span>
            <span class="order-type-chip__value">
                <span class="order-type-chip__primary">Choose one</span>
                <span class="order-type-chip__detail" hidden></span>
            </span>
            <button type="button" class="order-type-chip__edit" aria-label="Edit order type">
                ✎
            </button>
        </div>
        <div class="mobile-menu-swiper" aria-label="Menu items">
            <button type="button" class="swiper-arrow swiper-arrow-prev" aria-label="Previous menu item">
                <i class="bi bi-chevron-double-left" aria-hidden="true"></i>
            </button>
            <div class="swiper-track" role="list" id="menu-swiper-root"></div>
            <button type="button" class="swiper-arrow swiper-arrow-next" aria-label="Next menu item">
                <i class="bi bi-chevron-double-right" aria-hidden="true"></i>
            </button>
        </div>
    </nav>

    <div class="settings-overlay" id="settings-overlay" hidden>
        <div class="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
            <div class="settings-modal-header">
                <h2 id="settings-title">Settings</h2>
                <button type="button" class="settings-close" aria-label="Close settings">✕</button>
            </div>
            <div class="settings-panel" id="settings-panel">
                <label title="Ingredient label toggles checkbox">
                    <input type="checkbox" class="setting-label-selects" checked>
                    Easy ingredient tapping
                </label>
                <label title="Section title toggles checkbox">
                    <input type="checkbox" class="setting-title-selects" checked>
                    Easy menu item tapping
                </label>
                <label title="Menu item reset button disables item">
                    <input type="checkbox" class="setting-reset-disables">
                    Reset turns item off
                </label>
                <label title="Keep section open after menu item reset">
                    <input type="checkbox" class="setting-reset-keep-open">
                    Keep item open after reset
                </label>
                <label title="Auto-disable section when all optional ingredients are off">
                    <input type="checkbox" class="setting-auto-disable-empty">
                    Turn off empty items
                </label>
                <label title="Auto-disable section on manual disable">
                    <input type="checkbox" class="setting-auto-disable-section">
                    Clear items when turned off
                </label>
                <label title="Quantity zero disables section">
                    <input type="checkbox" class="setting-quantity-can-disable" checked>
                    Quantity can remove item
                </label>
                <label title="Menu pills expand on arrow only">
                    <input type="checkbox" class="setting-pill-arrow-only">
                    Arrow opens item details
                </label>
                <label title="Footer Next closes overlay first">
                    <input type="checkbox" class="setting-next-closes-overlay">
                    Footer button closes open item
                </label>
                <label title="Hide footer, theme pill, and Back in ingredient selector">
                    <input type="checkbox" class="setting-hide-overlay-chrome" checked>
                    Focus mode while editing items
                </label>
                <label title="Save Item button adds item to cart">
                    <input type="checkbox" id="setting-done-adds-to-cart" class="setting-done-adds-to-cart">
                    Save Item adds to order
                </label>
                <label title="Save prompts add item to cart">
                    <input type="checkbox" id="setting-prompt-adds-to-cart" class="setting-prompt-adds-to-cart" checked>
                    Save prompts add to order
                </label>
                <label title="Show cart toast notifications">
                    <input type="checkbox" id="setting-toast-enabled" checked>
                    Show add-to-order messages
                </label>
                <label title="Longer Page 2 toast duration">
                    <input type="checkbox" id="setting-toast-page2-long" checked>
                    Longer message time
                </label>
                <label title="Remove decorative outlines and rings across the UI">
                    <input type="checkbox" id="setting-disable-outlines" class="setting-disable-outlines" checked>
                    Disable all outlines
                </label>
                <button type="button" class="settings-reset" aria-label="Reset settings to defaults">Reset settings</button>
            </div>
        </div>
    </div>

    <div class="nav-theme-controls">
        <button type="button" class="theme-option theme-mode-toggle">
            <span class="theme-icon" aria-hidden="true">◐</span>
            <span class="theme-label">Dark Mode</span>
        </button>
        <button type="button" class="theme-option nav-toggle">
            <span class="theme-icon" aria-hidden="true">→</span>
            <span class="theme-label">Enable Navigation</span>
        </button>
        <button type="button" class="theme-option nav-settings-mobile" aria-label="Open settings" aria-expanded="false">
            <span class="theme-icon" aria-hidden="true">⚙️</span>
            <span class="theme-label">Settings</span>
        </button>
    </div>

    <!-- Right-side content area (Page 2 / Menu Builder) -->
    <main>
        <!-- Theme toggle -->
        <button class="go-back" type="button" aria-label="Back">Back</button>
        <button class="back-to-menu" type="button" aria-label="Back to menu builder">Back to menu</button>
        <!-- Page title -->
        <h1>Menu Builder</h1>
        <p>Select ingredients for each menu item below.</p>
        <p>Select Save Item to confirm your selections.</p>

        <div class="menu-actions" id="menu-actions-root" role="list"></div>
        <div id="menu-overlays-root"></div>

        <!-- Validation error for builder -->
        <p id="builder-error" class="form-error" hidden>Select at least one additional ingredient.
            continuing.</p>
        <footer class="page-footer">
            <a class="footer-back-button action-button" href="index.html" aria-label="Back to the menu builder">Back to
                menu</a>
            <button type="button" class="footer-reset action-button" aria-label="Reset all selections">Reset</button>
            <a class="next-button action-button" href="page3.html" aria-label="Go to next page">Next >></a>
        </footer>
    </main>

</body>
<script src="owner-config.js"></script>
<script src="main.js"></script>

</html>
