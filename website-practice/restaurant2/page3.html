<!-- Section: Document Type -->
<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Section: Head Meta -->
    <meta charset="UTF-8">
    <title>Restaurant Order Submission</title>
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
    <!-- Section: Stylesheets -->
    <link rel="stylesheet" href="styles.css">
</head>

<body class="page3">
    <!-- Section: Body Content -->

    <!-- Left rail -->
    <nav class="left-rail">
        <img src="logo.webp" alt="" class="nav-logo" aria-hidden="true">
        <a class="box" href="index.html">Page 1</a>
        <a class="box" href="page2.html">Page 2</a>
        <a class="box active" href="page3.html" aria-current="page">Page 3</a>
        <div class="order-type-chip" aria-live="polite" data-empty="true">
            <span class="order-type-chip__label">Order Type</span>
            <span class="order-type-chip__value">Not selected</span>
            <button type="button" class="order-type-chip__edit" aria-label="Edit order type">
                ✎
            </button>
        </div>
    </nav>

    <div class="settings-overlay" id="settings-overlay" hidden>
        <div class="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
            <div class="settings-modal-header">
                <h2 id="settings-title">Settings</h2>
                <button type="button" class="settings-close" aria-label="Close settings">✕</button>
            </div>
            <div class="settings-panel" id="settings-panel">
                <label title="Clicking an ingredient label also toggles its checkbox">
                    <input type="checkbox" class="setting-label-selects" checked>
                    Ingredient label toggles checkbox
                </label>
                <label title="Clicking a section title (e.g., Pizza/Burger/Sauces) toggles its section checkbox">
                    <input type="checkbox" class="setting-title-selects" checked>
                    Section title toggles checkbox
                </label>
                <label title="Menu item reset buttons also disable the item and clear its selections">
                    <input type="checkbox" class="setting-reset-disables">
                    Menu item reset button disables item
                </label>
                <label title="When a menu item reset disables an item, keep the section open">
                    <input type="checkbox" class="setting-reset-keep-open">
                    Keep section open after menu item reset
                </label>
                <label title="If you uncheck all optional ingredients, the section will auto-disable">
                    <input type="checkbox" class="setting-auto-disable-empty">
                    Auto-disable section when all optional ingredients are off
                </label>
                <label title="When you manually turn off a section, also disable it fully">
                    <input type="checkbox" class="setting-auto-disable-section">
                    Auto-disable section on manual disable
                </label>
                <label title="Allow quantity controls to reduce a section to zero and disable it">
                    <input type="checkbox" class="setting-quantity-can-disable" checked>
                    Quantity zero disables section
                </label>
                <label title="Menu pills only expand/collapse when their arrow is clicked">
                    <input type="checkbox" class="setting-pill-arrow-only">
                    Menu pills expand on arrow only
                </label>
                <label title="When an overlay is open, the footer Next button closes it">
                    <input type="checkbox" class="setting-next-closes-overlay">
                    Footer Next closes overlay first
                </label>
                <label title="Show toast when menu sections change">
                    <input type="checkbox" id="setting-toast-enabled" checked>
                    Show cart toast notifications
                </label>
                <button type="button" class="settings-reset" aria-label="Reset settings to defaults">Reset to
                    defaults</button>
            </div>
        </div>
    </div>

    <div class="nav-theme-controls">
        <button type="button" class="theme-option theme-mode-toggle">
            <span class="theme-icon" aria-hidden="true">☾</span>
            <span class="theme-label">Dark Mode</span>
        </button>
        <button type="button" class="theme-option nav-toggle">
            <span class="theme-icon" aria-hidden="true">→</span>
            <span class="theme-label">Enable Navigation</span>
        </button>
        <button type="button" class="theme-option nav-settings-mobile" aria-label="Open settings" aria-expanded="false">
            <span class="theme-icon" aria-hidden="true">⚙️</span>
            <span class="theme-label">Settings</span>
        </button>
    </div>

    <!-- Right-side content area (Page 3 / Summary + POS) -->
    <main>
        <div class="wrapper">
            <!-- Theme toggle -->
            <button class="go-back" type="button" aria-label="Go back">Go Back</button>
            <!-- Summary title -->
            <h1>Order Summary</h1>
            <!-- Summary block (rendered via main.js) -->
            <section id="order-summary">
                <!-- Filled by main.js -->
            </section>

            <div class="summary-divider" aria-hidden="true"></div>

            <!-- Placeholder for payment step -->
            <section class="pos-section">
                <h2>Point of Sale (POS)</h2>
                <p>This is where payment options and payment submission would be.</p>
                <div class="pos-actions">
                    <button class="pos-checkout" type="button" disabled>Checkout (Coming Soon)</button>
                </div>
            </section>
        </div>
    </main>

</body>
<script src="main.js"></script>

</html>
