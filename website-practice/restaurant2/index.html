<!-- Section: Document Type -->
<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Section: Head Meta -->
    <meta charset="UTF-8">
    <title>Restaurant Mobile Ordering</title>
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
    <!-- Section: Stylesheets -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="order-type">
    <!-- Section: Body Content -->

    <!-- Left rail (Site Navigation) -->
    <nav class="left-rail">
        <img src="logo.webp" alt="" class="nav-logo" aria-hidden="true">
        <a class="box active" href="index.html" aria-current="page">Pickup or Delivery</a>
        <a class="box" href="page2.html">Menu</a>
        <a class="box nav-cart" href="page3.html" aria-label="Cart" title="Cart"><i class="bi bi-cart3"
                aria-hidden="true"></i><span class="nav-cart-count" aria-hidden="true" hidden>0</span></a>
        <div class="order-type-chip" aria-live="polite" data-empty="true">
            <span class="order-type-chip__label">Pickup or Delivery</span>
            <span class="order-type-chip__value">Choose one</span>
            <button type="button" class="order-type-chip__edit" aria-label="Edit order type">
                ✎
            </button>
        </div>
    </nav>

    <div class="settings-overlay" id="settings-overlay" hidden>
        <div class="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
            <div class="settings-modal-header">
                <h2 id="settings-title">Settings</h2>
                <button type="button" class="settings-close" aria-label="Close settings">✕</button>
            </div>
            <div class="settings-panel" id="settings-panel">
                <label title="Ingredient label toggles checkbox">
                    <input type="checkbox" class="setting-label-selects" checked>
                    Easy ingredient tapping
                </label>
                <label title="Section title toggles checkbox">
                    <input type="checkbox" class="setting-title-selects" checked>
                    Easy menu item tapping
                </label>
                <label title="Menu item reset button disables item">
                    <input type="checkbox" class="setting-reset-disables">
                    Reset turns item off
                </label>
                <label title="Keep section open after menu item reset">
                    <input type="checkbox" class="setting-reset-keep-open">
                    Keep item open after reset
                </label>
                <label title="Auto-disable section when all optional ingredients are off">
                    <input type="checkbox" class="setting-auto-disable-empty">
                    Turn off empty items
                </label>
                <label title="Auto-disable section on manual disable">
                    <input type="checkbox" class="setting-auto-disable-section">
                    Clear items when turned off
                </label>
                <label title="Quantity zero disables section">
                    <input type="checkbox" class="setting-quantity-can-disable" checked>
                    Quantity can remove item
                </label>
                <label title="Menu pills expand on arrow only">
                    <input type="checkbox" class="setting-pill-arrow-only">
                    Arrow opens item details
                </label>
                <label title="Footer Next closes overlay first">
                    <input type="checkbox" class="setting-next-closes-overlay">
                    Footer button closes open item
                </label>
                <label title="Hide footer, theme pill, and Back in ingredient selector">
                    <input type="checkbox" class="setting-hide-overlay-chrome" checked>
                    Focus mode while editing items
                </label>
                <label title="Save Item button adds item to cart">
                    <input type="checkbox" id="setting-done-adds-to-cart" class="setting-done-adds-to-cart">
                    Save Item adds to order
                </label>
                <label title="Save prompts add item to cart">
                    <input type="checkbox" id="setting-prompt-adds-to-cart" class="setting-prompt-adds-to-cart" checked>
                    Save prompts add to order
                </label>
                <label title="Show cart toast notifications">
                    <input type="checkbox" id="setting-toast-enabled" checked>
                    Show add-to-order messages
                </label>
                <button type="button" class="settings-reset" aria-label="Reset settings to defaults">Reset settings</button>
            </div>
        </div>
    </div>

    <div class="nav-theme-controls">
        <button type="button" class="theme-option theme-mode-toggle">
            <span class="theme-icon" aria-hidden="true">◐</span>
            <span class="theme-label">Dark Mode</span>
        </button>
        <button type="button" class="theme-option nav-toggle">
            <span class="theme-icon" aria-hidden="true">→</span>
            <span class="theme-label">Enable Navigation</span>
        </button>
        <button type="button" class="theme-option nav-settings-mobile" aria-label="Open settings" aria-expanded="false">
            <span class="theme-icon" aria-hidden="true">⚙️</span>
            <span class="theme-label">Settings</span>
        </button>
    </div>

    <!-- Right-side content area (Page 1 / Order Type) -->
    <main>
        <!-- Page title -->
        <h1>Select your order type:</h1>

        <section class="business-location-picker" aria-label="Business location">
            <label for="business-location-select">Business Location</label>
            <div class="business-location-dropdown">
                <button type="button" id="business-location-select" class="business-location-trigger"
                    aria-haspopup="listbox" aria-expanded="false" aria-controls="business-location-options">
                    <span class="business-location-trigger-text">John Doe | 123 Placeholder Ave | Sampletown, NY 10000</span>
                </button>
                <div id="business-location-options" class="business-location-options" role="listbox" hidden>
                    <button type="button" class="business-location-option" role="option" data-value="default"
                        aria-selected="true">John Doe | 123 Placeholder Ave | Sampletown, NY 10000</button>
                </div>
            </div>
        </section>

        <!-- Order type chooser cards -->
        <div class="order-options" role="list">
            <a class="order-card" href="page2.html" role="listitem" aria-label="Dine In or Carryout" data-type="dine">
                <svg aria-hidden="true" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 10h18" />
                    <path d="M5 10V6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v4" />
                    <path d="M3 10l2 10h14l2-10" />
                </svg>
                <div class="order-label">
                    <strong>Dine-In</strong><strong><br>or Carryout</strong>
                </div>
            </a>
            <a class="order-card" href="page2.html" role="listitem" aria-label="Delivery" data-type="delivery">
                <svg aria-hidden="true" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 16V7a1 1 0 0 1 1-1h9v10" />
                    <path d="M13 9h4l4 4v3h-8" />
                    <circle cx="7" cy="17" r="2" />
                    <circle cx="17" cy="17" r="2" />
                </svg>
                <div class="order-label">
                    <strong>Delivery</strong>
                </div>
            </a>
        </div>

        <!-- Delivery details (shown when Delivery is selected) -->
        <form id="delivery-details" class="delivery-details" hidden novalidate>
            <div class="delivery-details-heading">
                <h2>Delivery Details</h2>
                <button type="button" class="delivery-close-button" aria-label="Close delivery details">✕</button>
            </div>
            <div class="field">
                <label for="delivery-name">Name <span class="req">*</span></label>
                <input type="text" id="delivery-name" name="delivery_name" autocomplete="name" required maxlength="60">
            </div>
            <div class="field">
                <label for="delivery-phone">Phone Number <span class="req">*</span></label>
                <input type="tel" id="delivery-phone" name="delivery_phone" autocomplete="tel" inputmode="tel" required
                    maxlength="14">
            </div>
            <div class="field">
                <label for="delivery-address">Street Address <span class="req">*</span></label>
                <input type="text" id="delivery-address" name="delivery_address" autocomplete="street-address" required
                    maxlength="100">
            </div>
            <div class="field">
                <label for="delivery-suite">Apt / Suite (optional)</label>
                <input type="text" id="delivery-suite" name="delivery_suite" autocomplete="address-line2"
                    maxlength="60">
            </div>
            <div class="field">
                <label for="delivery-type">Residence Type <span class="req">*</span></label>
                <select id="delivery-type" name="delivery_type" required>
                    <option value="Hotel">Hotel</option>
                    <option value="School">School</option>
                    <option value="Business">Business</option>
                    <option value="Apartment">Apartment</option>
                    <option value="House" selected>House</option>
                </select>
            </div>
            <div class="field">
                <label for="delivery-city">City <span class="req">*</span></label>
                <input type="text" id="delivery-city" name="delivery_city" required maxlength="50">
            </div>
            <div class="field">
                <label for="delivery-zip">Zip <span class="req">*</span></label>
                <input type="text" id="delivery-zip" name="delivery_zip" inputmode="numeric" pattern="[0-9-]*"
                    title="Digits and hyphens only" required maxlength="10">
            </div>
            <p id="delivery-error" class="form-error" hidden>Sorry, we cannot accept your order. We currently serve zip
                code 13309 only.</p>
            <div class="delivery-actions">
                <button type="button" class="delivery-clear">Clear All Fields</button>
                <button type="submit" class="delivery-continue">Continue »</button>
            </div>
        </form>

        <!-- Helper note under choices -->
        <p class="order-note">Then, click proceed to continue.</p>

        <!-- <p class="order-links">
            <a href="#">Privacy Policy</a>
            <span> </span>
            <a href="#">Terms of Use</a>
        </p> -->
        <!-- <p class="order-powered">Powered By <a href="#">Company</a></p> -->

        <footer class="page-footer">
            <button type="button" class="next-button action-button proceed-order-type" aria-label="Proceed to page 2"
                aria-disabled="true">Proceed >></button>
        </footer>

    </main>
    <!-- Section: Page Script -->
    <script src="main.js"></script>

    <!-- Section: End Body -->
</body>

</html>
