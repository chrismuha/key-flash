<body>
    <!-- Section: Body Content -->
    <form action="test-action_page.php" method="POST" enctype="multipart/form-data">

        <div class="business-logo">
            <img class="only-light" src="images/MCRred1-cropped.webp">
            <img class="only-dark" src="images/black-banner.webp">
        </div>

        <label>Theme:</label>
        <div class="themes-switcher">
            <div class="active system-theme-option" data-theme="system">System</div>
            <div data-theme="light">Light</div>
            <div data-theme="dark">Dark</div>
        </div>
        <br>

        <label for="username">Username:</label>
        <input type="text" id="username" placeholder="Username" minlength="5" maxlength="25" required>
        <br>

        <label for="password">Password:</label>
        <input type="password" id="password" placeholder="Create a Password" minlength="16" maxlength="24" required>
        <br>

        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="user@gmail.com">
        <br>
<div class="container">
<div class="input-wrapper">
        <label for="phone">Phone #:</label>
        <input type="text" id="phone" name="phone" data-mobile-keypad="numeric" oninput="formatPhoneNumber(this); validateInput(event);" maxlength="12" placeholder="123-456-7890" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}">
        <p id="error-message">Only numbers are allowed!</p>
        <br>

        <label for="bday">Birthdate:</label>
        <input type="text" id="bday" data-mobile-keypad="numeric" placeholder="MM/DD/YYYY" pattern="\d{2}/\d{2}/\d{4}" maxlength="10" required>
        <br>

        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" min="0" max="99" value="1">
        <br>

        <div class="horizontal">
            <div>
                <label for="title-honorific">Honorific:</label>
                <select id="title-honorific" name="title-honorific">
                    <option value="">Select</option>
                    <option value="Mr.">Mr.</option>
                    <option value="Mrs.">Mrs.</option>
                    <option value="Ms.">Ms.</option>
                    <option value="Miss">Miss</option>
                    <option value="Mx.">Mx.</option>
                    <option value="Dr.">Dr.</option>
                    <option value="Prof.">Prof.</option>
                    <option value="Rev.">Rev.</option>
                    <option value="Hon.">Hon.</option>
                    <option value="Sir">Sir</option>
                    <option value="Dame">Dame</option>
                    <option value="Fr.">Fr.</option>
                    <option value="Rabbi">Rabbi</option>
                    <option value="Imam">Imam</option>
                    <option value="Pastor">Pastor</option>
                    <option value="Judge">Judge</option>
                    <option value="Justice">Justice</option>
                    <option value="Officer">Officer</option>
                    <option value="Captain">Captain</option>
                    <option value="Major">Major</option>
                    <option value="Colonel">Colonel</option>
                    <option value="General">General</option>
                    <option value="Lt.">Lt.</option>
                    <option value="Sgt.">Sgt.</option>
                    <option value="Cpl.">Cpl.</option>
                </select>
            </div>

            <div>
                <label for="title-credentials">Credentials:</label>
                <select id="title-credentials" name="title-credentials">
                    <option value="">Select</option>
                    <option value="MD">MD</option>
                    <option value="DO">DO</option>
                    <option value="DDS">DDS</option>
                    <option value="DMD">DMD</option>
                    <option value="PhD">PhD</option>
                    <option value="JD">JD</option>
                    <option value="Esq.">Esq.</option>
                    <option value="MBA">MBA</option>
                    <option value="MS">MS</option>
                    <option value="MA">MA</option>
                    <option value="BS">BS</option>
                    <option value="BA">BA</option>
                    <option value="EdD">EdD</option>
                    <option value="PharmD">PharmD</option>
                    <option value="DVM">DVM</option>
                    <option value="CPA">CPA</option>
                    <option value="PE">PE</option>
                    <option value="RN">RN</option>
                    <option value="LPN">LPN</option>
                </select>
            </div>

            <div>
                <label for="title-suffix">Suffix:</label>
                <select id="title-suffix" name="title-suffix">
                    <option value="">Select</option>
                    <option value="Jr.">Jr.</option>
                    <option value="Sr.">Sr.</option>
                    <option value="II">II</option>
                    <option value="III">III</option>
                    <option value="IV">IV</option>
                    <option value="V">V</option>
                </select>
            </div>
        </div>
        <br>

        <div id="payment">
            <label for="payment-method">Payment</label>
            <select id="payment-method">
                <option value="Visa">Visa</option>
                <option value="Mastercard">Mastercard</option>
                <option value="Discover">Discover</option>
                <option value="American Express">American Express</option>
                <option value="Gift Card">Gift Card</option>
            </select>

            <div id="credit-card-section">
                <label for="card-number">Card Number:</label>
                <input type="text" id="card-number" data-mobile-keypad="numeric" autocomplete="cc-number" inputmode="text" maxlength="19" placeholder="1234 5678 9012 3456" pattern="[0-9 ]{13,19}">

                <label for="card-exp">Expiration (MM/YY):</label>
                <input type="text" id="card-exp" data-mobile-keypad="numeric" autocomplete="cc-exp" inputmode="text" maxlength="5" placeholder="MM/YY" pattern="\d{2}/\d{2}">

                <label for="card-cvv">CVV:</label>
                <input type="text" id="card-cvv" data-mobile-keypad="numeric" autocomplete="cc-csc" inputmode="text" maxlength="4" placeholder="123" pattern="\d{3,4}">
            </div>
        </div>
        <br>

        <div class="exam-attempt">
            <input type="checkbox" id="Exam Attempt" />
            <label for="exam-check">Exam Attempt</label>
        </div>

        <label for="comment">Comment:</label>
        <textarea id="comment"></textarea>
        <br>

        <label class="file-upload" for="file">File:</label>
        <input type="file" id="file" accept=".webp, .jpeg, .heic, .pdf">
        <br>

        <input type="reset">
        <br>
        <input type="submit">

        <button id="exportButton">Export PDF</button>

    </form>
    </div>
