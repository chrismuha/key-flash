<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Theme Switch Demo</title>
  <link rel="stylesheet" href="theme-switch.css">
</head>

<body>
  <h1>Theme Switch Demo</h1>
  <p>Use the switch in the top-right corner to change themes.</p>

  <script src="theme-switch.js"></script>
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      ThemeToggle.init();
      ThemeToggle.onChange((t) => console.log("Theme is now:", t));
    });
  </script>
</body>

</html>
